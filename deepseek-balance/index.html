<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DeepSeek 余额查询</title>
<style>
  :root{
    --bg:#070b14;
    --text:#e9edf6;
    --muted:#8b94a8;
    --dim:#5f6880;
    --brand:#4d6bfe;
    --brand2:#7c5cff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:28px 18px;
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1000px 520px at 12% -12%, rgba(77,107,254,.28), transparent 62%),
      radial-gradient(820px 520px at 108% 112%, rgba(124,92,255,.20), transparent 62%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;max-width:540px;
    padding:32px 30px 24px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(180deg, rgba(22,30,48,.94), rgba(13,19,33,.94));
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(14px);
  }

  .head{display:flex;align-items:center;gap:13px}
  .logo{
    width:44px;height:44px;flex:none;border-radius:13px;
    display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 10px 26px rgba(77,107,254,.38);
  }
  h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px}
  .tagline{margin-top:3px;font-size:12px;color:var(--dim)}

  .sub{margin:16px 0 20px;font-size:13px;line-height:1.65;color:var(--muted)}
  .sub b{color:#aab4cc;font-weight:600}

  .field{position:relative}
  .field input{
    width:100%;height:52px;padding:0 50px 0 16px;
    border-radius:14px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);color:var(--text);
    font-size:15px;font-family:inherit;outline:none;
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .field input::placeholder{color:#525b70}
  .field input:focus{
    border-color:rgba(96,122,255,.75);
    background:rgba(255,255,255,.06);
    box-shadow:0 0 0 4px rgba(77,107,254,.16);
  }
  .eye{
    position:absolute;right:7px;top:7px;width:38px;height:38px;
    display:grid;place-items:center;
    border:0;border-radius:10px;background:transparent;color:var(--dim);
    cursor:pointer;transition:background .15s,color .15s;
  }
  .eye:hover{background:rgba(255,255,255,.07);color:var(--text)}
  .eye svg{width:19px;height:19px}

  .remember{
    display:flex;align-items:flex-start;gap:8px;
    margin:14px 2px 18px;font-size:13px;color:var(--muted);
    cursor:pointer;user-select:none;line-height:1.5;
  }
  .remember input{width:15px;height:15px;margin:2px 0 0;accent-color:var(--brand);cursor:pointer;flex:none}
  .remember .note{color:var(--dim);font-size:12px}

  .btn{
    width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    font-family:inherit;font-size:15px;font-weight:600;color:#fff;letter-spacing:.3px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 12px 30px rgba(77,107,254,.34);
    transition:filter .15s, transform .05s, opacity .15s, box-shadow .15s;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn:disabled{opacity:.75;cursor:default;filter:none;box-shadow:none}
  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .alert{
    display:none;gap:9px;align-items:flex-start;
    margin-top:18px;padding:13px 15px;border-radius:13px;
    font-size:13.5px;line-height:1.55;
  }
  .alert.show{display:flex;animation:rise .3s ease}
  .alert.err{background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.26);color:#fca5a5}
  .alert.warn{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.26);color:#fcd34d}
  .alert svg{width:16px;height:16px;flex:none;margin-top:2px}

  .result{display:none;margin-top:20px}
  .result.show{display:block;animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  .status{display:flex;align-items:center;gap:9px;margin-bottom:13px;font-size:13px;color:var(--muted)}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;
  }
  .badge.ok{background:rgba(52,211,153,.11);border:1px solid rgba(52,211,153,.28);color:#6ee7b7}
  .badge.bad{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.30);color:#fcd34d}

  .bal{
    padding:18px 18px 6px;margin-bottom:12px;
    border-radius:16px;border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
  }
  .bal .top{display:flex;align-items:center;justify-content:space-between}
  .bal .label{font-size:13px;color:var(--muted)}
  .cur{
    font-size:11.5px;font-weight:700;letter-spacing:.6px;color:#aab4cc;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);
    padding:3px 9px;border-radius:7px;
  }
  .total{
    margin-top:6px;font-size:38px;font-weight:700;letter-spacing:-.8px;
    font-variant-numeric:tabular-nums;
  }
  .rows{margin-top:15px;border-top:1px dashed rgba(255,255,255,.1);padding:12px 0 10px}
  .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding:3.5px 0}
  .row b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

  .meta{margin-top:15px;text-align:center;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <div class="logo">&#128011;</div>
    <div>
      <h1>DeepSeek 余额查询</h1>
      <div class="tagline">官方接口 · api.deepseek.com</div>
    </div>
  </div>

  <p class="sub">
    输入你的 <b>API Key</b>，直接查询 DeepSeek 官方账户余额。
    请求由当前浏览器直接发送到 <b>api.deepseek.com</b>，不经过任何第三方服务器。
  </p>

  <div class="field">
    <input id="key" type="password" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
    <button id="eye" class="eye" type="button" title="显示 / 隐藏 Key"></button>
  </div>

  <label class="remember">
    <input id="remember" type="checkbox">
    <span>在本机浏览器记住 Key
      <span class="note">（保存在浏览器本地存储中，公共电脑请勿勾选）</span>
    </span>
  </label>

  <button id="query" class="btn" type="button">查询余额</button>

  <div id="alert" class="alert"></div>
  <section id="result" class="result"></section>
  <div id="meta" class="meta">余额数据来自 DeepSeek 官方接口</div>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const API_URL = "https://api.deepseek.com/user/balance";
  const LS_KEY = "deepseek_balance_api_key";
  const LS_REMEMBER = "deepseek_balance_remember_key";

  const keyInput = $("#key");
  const eyeBtn = $("#eye");
  const rememberChk = $("#remember");
  const queryBtn = $("#query");
  const alertBox = $("#alert");
  const resultBox = $("#result");
  const metaEl = $("#meta");

  const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_CLOSED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  const ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

  let busy = false;

  class UserError extends Error {}

  function showAlert(kind, message) {
    alertBox.className = "alert show " + kind;
    alertBox.innerHTML = ICON_ALERT + "<div>" + message + "</div>";
  }
  function hideAlert() {
    alertBox.className = "alert";
  }

  function fmtAmount(raw, currency) {
    const n = Number.parseFloat(raw);
    if (!Number.isFinite(n)) return raw == null ? "--" : String(raw);
    const symbol = currency === "CNY" ? "\u00a5" : currency === "USD" ? "$" : "";
    return symbol + n.toFixed(2);
  }

  const CURRENCY_NAME = { CNY: "人民币", USD: "美元" };

  function render(data) {
    const infos = Array.isArray(data.balance_infos) ? data.balance_infos : [];
    const ok = data.is_available === true;

    const badge = ok
      ? '<span class="badge ok">\u2713 账户可用</span>'
      : '<span class="badge bad">! 余额不足，无法调用</span>';

    let html = '<div class="status">' + badge +
      "<span>共 " + infos.length + " 个币种账户</span></div>";

    if (!infos.length) {
      html += '<div class="bal"><div class="top"><span class="label">接口未返回余额明细</span></div></div>';
    }

    for (const info of infos) {
      const cur = info.currency || "";
      const curName = CURRENCY_NAME[cur] ? " · " + CURRENCY_NAME[cur] : "";
      html +=
        '<div class="bal">' +
          '<div class="top">' +
            '<span class="label">总余额</span>' +
            '<span class="cur">' + (cur || "--") + curName + "</span>" +
          "</div>" +
          '<div class="total">' + fmtAmount(info.total_balance, cur) + "</div>" +
          '<div class="rows">' +
            '<div class="row"><span>充值余额</span><b>' + fmtAmount(info.topped_up_balance, cur) + "</b></div>" +
            '<div class="row"><span>赠金余额</span><b>' + fmtAmount(info.granted_balance, cur) + "</b></div>" +
          "</div>" +
        "</div>";
    }

    resultBox.innerHTML = html;
    resultBox.classList.add("show");
  }

  async function query() {
    if (busy) return;
    const key = keyInput.value.trim();

    if (!key) {
      showAlert("warn", "请先输入 API Key。");
      keyInput.focus();
      return;
    }
    if (!key.startsWith("sk-")) {
      showAlert("warn", "提醒：DeepSeek 的 API Key 一般以 sk- 开头，请确认是否复制完整。");
    } else {
      hideAlert();
    }

    busy = true;
    queryBtn.disabled = true;
    queryBtn.innerHTML = '<span class="spinner"></span>查询中…';
    resultBox.classList.remove("show");

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);

    try {
      const res = await fetch(API_URL, {
        method: "GET",
        headers: { "Authorization": "Bearer " + key, "Accept": "application/json" },
        signal: ctrl.signal,
        cache: "no-store",
      });

      if (!res.ok) {
        let detail = "";
        try {
          const body = await res.json();
          detail = (body && body.error && body.error.message) || "";
        } catch (_) {}

        if (res.status === 401) throw new UserError("API Key 无效或已被禁用。请检查是否复制完整、有没有多余的空格或换行。");
        if (res.status === 402) throw new UserError("账户余额不足。");
        if (res.status === 429) throw new UserError("请求太频繁，请稍后再试。");
        throw new UserError("DeepSeek 接口返回错误：HTTP " + res.status + (detail ? "（" + detail + "）" : ""));
      }

      const data = await res.json();
      hideAlert();
      render(data);

      try {
        if (rememberChk.checked) {
          localStorage.setItem(LS_KEY, key);
          localStorage.setItem(LS_REMEMBER, "1");
        } else {
          localStorage.removeItem(LS_KEY);
          localStorage.removeItem(LS_REMEMBER);
        }
      } catch (_) {}

      metaEl.textContent = "查询时间 " + new Date().toLocaleString("zh-CN", { hour12: false });
    } catch (err) {
      if (err instanceof UserError) {
        showAlert("err", err.message);
      } else if (err && err.name === "AbortError") {
        showAlert("err", "请求超时（20 秒）。请检查网络状况后重试。");
      } else {
        showAlert("err", "无法连接 api.deepseek.com。请检查网络或代理设置；若网络正常，请尝试用 Chrome / Edge 打开本页面。");
      }
    } finally {
      clearTimeout(timer);
      busy = false;
      queryBtn.disabled = false;
      queryBtn.textContent = "查询余额";
    }
  }

  eyeBtn.innerHTML = EYE_OPEN;
  eyeBtn.addEventListener("click", () => {
    const show = keyInput.type === "password";
    keyInput.type = show ? "text" : "password";
    eyeBtn.innerHTML = show ? EYE_CLOSED : EYE_OPEN;
    keyInput.focus();
  });

  rememberChk.addEventListener("change", () => {
    if (!rememberChk.checked) {
      try {
        localStorage.removeItem(LS_KEY);
        localStorage.removeItem(LS_REMEMBER);
      } catch (_) {}
    }
  });

  queryBtn.addEventListener("click", query);
  keyInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") query();
  });
  keyInput.addEventListener("input", () => {
    if (alertBox.classList.contains("warn")) hideAlert();
  });

  (function restore() {
    try {
      const saved = localStorage.getItem(LS_KEY);
      if (saved && localStorage.getItem(LS_REMEMBER) === "1") {
        keyInput.value = saved;
        rememberChk.checked = true;
        query();
      }
    } catch (_) {}
  })();
</script>
</body>
</html>
